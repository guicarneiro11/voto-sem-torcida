name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o workflow só lê o repositório
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Dica: depois fixe as actions por SHA do commit (o Dependabot mantém atualizado)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm check # astro check: tipos + validação do schema de conteúdo
      - run: pnpm test
      - run: pnpm build
